<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livros - Biblioteca</title>
</head>
<body>

<h1>Módulo de Livros</h1>

<h2>Livro cadastrado:</h2>

<p>
    Título: <span th:text="${livro.titulo}"></span>
</p>

<p>
    Autor: <span th:text="${livro.autor}"></span>
</p>

<p>
    ISBN: <span th:text="${livro.isbn}"></span>
</p>

<a th:href="@{/}">Voltar ao início</a>

</body>
</html>
